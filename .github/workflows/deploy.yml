name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Only one Pages deploy may run at a time; cancel in-flight runs when a new
# push arrives so the latest commit always wins.
concurrency:
  group: pages
  cancel-in-progress: true

# Least-privilege: Pages deploy requires pages+id-token write; source read only.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: seo-test/site/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: seo-test/site
        run: npm ci

      - name: Build site
        working-directory: seo-test/site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: seo-test/site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
